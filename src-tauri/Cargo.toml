[package]
name = "mintune"
version = "0.4.805"
description = "Mintune 薄荷音乐：本地优先的音乐播放器"
authors = ["Mintune"]
license = "MIT"
repository = "https://github.com/Nebula-Lanye/Mintune"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1" }
tauri-plugin-log = "2"

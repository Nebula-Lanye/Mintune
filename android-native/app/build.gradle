plugins { id 'com.android.application' }

android { namespace 'com.lkr2312.mintune'; compileSdk 35
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    defaultConfig { applicationId 'com.lkr2312.mintune'; minSdk 24; targetSdk 35; versionCode 4805; versionName '0.4.805' }
    def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
    if (keystorePath != null && !keystorePath.trim().isEmpty()) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes { release {
        minifyEnabled false
        shrinkResources false
        if (keystorePath != null && !keystorePath.trim().isEmpty()) { signingConfig signingConfigs.release }
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    } }
}

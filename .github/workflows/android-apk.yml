name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Local Android APK
    # Pin the runner so a future hosted-image migration cannot change
    # the Android/Gradle build environment unexpectedly.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EAS_LOCAL_BUILD_SKIP_CLEANUP: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        run: npm install --global pnpm@9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Set up Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN"
          echo "EXPO_TOKEN=$EXPO_TOKEN" >> "$GITHUB_ENV"

      - name: Restore Android signing key
        run: |
          mkdir -p .eas artifacts
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > .eas/mintune-release.jks
          chmod 600 .eas/mintune-release.jks
          cat > credentials.json <<'EOF'
          {
            "android": {
              "keystore": {
                "keystorePath": ".eas/mintune-release.jks",
                "keystorePassword": "${{ secrets.KEYSTORE_PASSWORD }}",
                "keyAlias": "${{ secrets.KEY_ALIAS }}",
                "keyPassword": "${{ secrets.KEY_PASSWORD }}"
              }
            }
          }
          EOF

      - name: Build APK locally
        run: eas build --local --platform android --profile preview --non-interactive --output "$GITHUB_WORKSPACE/artifacts/mintune.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v5
        with:
          name: mintune-android-apk
          path: artifacts/mintune.apk
          if-no-files-found: error
          retention-days: 14

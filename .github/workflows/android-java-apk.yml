name: Build Native Java Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "android-java-v*"

permissions:
  contents: read

jobs:
  build-native-java:
    name: Native Java Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Restore Android release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          mkdir -p "$GITHUB_WORKSPACE/.secrets"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/.secrets/mintune-release.jks"
          chmod 600 "$GITHUB_WORKSPACE/.secrets/mintune-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/.secrets/mintune-release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build native Java release APK
        working-directory: android-native
        run: gradle --no-daemon assembleRelease

      - name: Copy APK to artifacts
        run: |
          mkdir -p artifacts
          APK=$(find android-native/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" artifacts/mintune-native-java.apk

      - name: Verify APK signature
        run: |
          APK=$(find android-native/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          SDKMANAGER=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)/apksigner
          "$SDKMANAGER" verify --verbose "$APK"

      - name: Upload native Java APK
        uses: actions/upload-artifact@v5
        with:
          name: mintune-native-java-apk
          path: artifacts/mintune-native-java.apk
          if-no-files-found: error
          retention-days: 14

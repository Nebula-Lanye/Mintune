name: Build Native Java Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "android-java-v*"

permissions:
  contents: read

jobs:
  build-native-java:
    name: Native Java Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build native Java release APK
        working-directory: android-native
        run: gradle --no-daemon assembleRelease

      - name: Copy APK to artifacts
        run: |
          mkdir -p artifacts
          APK=$(find android-native/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" artifacts/mintune-native-java.apk

      - name: Upload native Java APK
        uses: actions/upload-artifact@v5
        with:
          name: mintune-native-java-apk
          path: artifacts/mintune-native-java.apk
          if-no-files-found: error
          retention-days: 14
